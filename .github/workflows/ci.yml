name: تحقق التطبيق

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: اختبارات وأنواع وبناء
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v4

      - name: إعداد pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: إعداد Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: تثبيت الاعتمادات المقفلة
        run: pnpm install --frozen-lockfile

      - name: تشغيل بوابة الإصدار
        run: pnpm run check:ci
