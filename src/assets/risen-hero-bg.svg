<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a0a"/>
      <stop offset="55%" stop-color="#1c3318"/>
      <stop offset="100%" stop-color="#0a1408"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtn-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f4a28"/>
      <stop offset="100%" stop-color="#16260f"/>
    </linearGradient>
    <linearGradient id="mtn-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2c14"/>
      <stop offset="100%" stop-color="#0b1408"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <circle cx="960" cy="150" r="160" fill="url(#moon-glow)"/>
  <circle cx="960" cy="150" r="52" fill="#e9dcb5" opacity="0.9"/>

  <polygon points="0,420 150,300 260,380 400,260 520,360 650,290 800,400 950,320 1080,390 1200,330 1200,630 0,630" fill="url(#mtn-far)" opacity="0.85"/>
  <polygon points="0,500 120,430 300,470 480,400 700,480 900,420 1080,470 1200,430 1200,630 0,630" fill="url(#mtn-near)"/>

  <g opacity="0.5" stroke="#c9a24d" stroke-width="2">
    <line x1="140" y1="470" x2="140" y2="560"/>
    <polygon points="115,470 165,470 140,430" fill="#c9a24d" stroke="none"/>
  </g>

  <rect width="1200" height="630" fill="#000000" opacity="0.15"/>
</svg>
